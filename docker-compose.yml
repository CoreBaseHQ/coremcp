services:
  coremcp:
    image: y11t0/coremcp:latest
    container_name: coremcp
    restart: unless-stopped
    volumes:
      - ./coremcp.yaml:/app/coremcp.yaml:ro
    environment:
      - TZ=UTC
    # Default CMD runs `coremcp serve --config /app/coremcp.yaml`.
    # For stdio transport (e.g. embedded MCP client), override CMD to:
    #   command: ["serve", "--config", "/app/coremcp.yaml", "--transport", "stdio"]
    # For HTTP transport, expose the port:
    # ports:
    #   - "8080:8080"
